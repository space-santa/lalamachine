name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build lalamachine.sln
      - run: dotnet test lalamachine.sln --no-build

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Lalamachine.Desktop
      # Not the tests that need speakers, a runner may have none.
      - run: dotnet test LibLala.Unittests --filter "TestCategory!=AudioDevice"
      - run: dotnet test Lalamachine.ViewModel.Unittests
      - run: dotnet test Settings.Unittests
