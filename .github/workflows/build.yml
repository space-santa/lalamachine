name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build lalamachine.sln
      - run: dotnet test lalamachine.sln --no-build

  # The solution includes the WPF app, so build only what runs on macOS.
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Lalamachine.Desktop
      - run: dotnet test Lalamachine.ViewModel.Unittests
